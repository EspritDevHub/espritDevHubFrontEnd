<div *ngFor="let seance of (documentsGrouped | keyvalue)" class="p-mb-5">
    <p-card class="p-mb-4">
      <ng-template pTemplate="header">
        <h2 style="color:#00bcd4;">📘 Rendu : {{ seance.key }}</h2>
      </ng-template>
  
      <ng-template pTemplate="content">
        <div *ngFor="let etudiant of (seance.value | keyvalue)"
             class="p-mb-4 p-p-3 p-shadow-2"
             style="border-radius:8px; background:#2e3b55; color:#ffffff;">
  
          <h3 style="cursor:pointer;" (click)="toggleEtudiant(seance.key, etudiant.key)">
            👤 Étudiant : {{ etudiant.key }}
            <span *ngIf="isOpened(seance.key, etudiant.key)">▲</span>
            <span *ngIf="!isOpened(seance.key, etudiant.key)">▼</span>
          </h3>
  
          <div *ngIf="isOpened(seance.key, etudiant.key)">
            <div *ngFor="let doc of etudiant.value"
                 class="p-card p-mb-4 p-shadow-2"
                 style="border-radius:6px; background:#3c4a68; color:#ffffff;">
  
              <div class="p-card-body">
                <!-- Affichage document -->
                <div class="p-mb-3">
                  <ng-container [ngSwitch]="doc.type">
  
                    <!-- Lien -->
                    <ng-container *ngSwitchCase="'LIEN'">
                      <a [href]="doc.nomFichier"
                         target="_blank"
                         class="p-button p-button-text p-mb-2"
                         style="color:#00bcd4;">
                        🔗 {{ doc.nomFichier }}
                      </a>
  
                      <div class="p-mt-2">
                        <button pButton
                                type="button"
                                label="📊 Générer Évaluation Code"
                                class="p-button-warning"
                                (click)="evaluateGitLink(doc)">
                        </button>
                      </div>
                    </ng-container>
  
                    <!-- Document PDF -->
                    <ng-container *ngSwitchCase="'DOCUMENT'">
                      <iframe *ngIf="doc.nomFichier.toLowerCase().endsWith('.pdf')"
                              [src]="sanitizeUrl(doc.nomFichier)"
                              width="100%"
                              height="500px"
                              style="border:none; background:#fff;">
                            
                      </iframe>
                      <div class="p-mt-4  p-mb-4 p-d-flex p-flex-wrap p-ai-center p-gap-3">
                        <!-- Bouton Télécharger -->
                        <a [href]="doc.nomFichier"
                           target="_blank"
                           class="p-button p-button-outlined p-button-warning p-d-flex p-ai-center">
                          <i class="pi pi-download p-mr-2"></i>
                          Télécharger
                        </a>
                      
                  

                            <button
                              pButton
                              type="button"
                              label="📊 Générer Évaluation des Besoins"
                              class="p-button-warning p-mr-2"
                              (click)="evaluateCahierCharge(doc)">
                            </button>
      
                        
                          </div>
                      
                    </ng-container>
  
                    <!-- Texte brut -->
                    <ng-container *ngSwitchCase="'TEXTE'">
                      <pre style="background:#1f2d4a; color:#e1e1e1; border:1px solid #ddd; padding:10px; white-space: pre-wrap;">
                        {{ doc.contenu }}
                      </pre>
  
                      <div class="p-mt-2">
                        <button
                          pButton
                          type="button"
                          label="📊 Générer Évaluation des Besoins"
                          class="p-button-warning p-mr-2"
                          (click)="SuggestEvaluationText(doc)">
                        </button>
  
                    
                      </div>
                    </ng-container>
  
                    <!-- Fichiers non pris en charge -->
                    <ng-container *ngSwitchDefault>
                      <p>Format non supporté pour la visualisation.</p>
                      <a [href]="doc.nomFichier"
                         target="_blank"
                         class="p-button p-button-secondary">
                        📥 Télécharger
                      </a>
                    </ng-container>
                  </ng-container>
                </div>
  
                <!-- Formulaire d’évaluation -->
                <div class="p-grid p-formgrid p-fluid p-align-center"
                     style="background-color: #1a2639; padding: 1.5rem; border-radius: 12px;">
                  <div class="p-field p-col-12 p-md-3">
                    <label style="color: #ffffff;">Note</label>
                    <input type="number"
                           pInputText
                           [(ngModel)]="doc.note"
                           min="0"
                           max="20"
                           [readonly]="doc.type === 'TEXTE' && doc.note != null"
                           style="background-color: #ffffff; color: #000000;" />
                  </div>
  
                  <div class="p-field p-col-12 p-md-6" style="border-top: 2px solid #00bcd4; padding-top: 1rem;">
                    <label style="color: #ffffff;">Commentaire:</label>
                    <input type="text"
                           pInputText
                           [(ngModel)]="doc.commentaire"
                           [readonly]="doc.type === 'TEXTE' && doc.commentaire"
                           placeholder="Ce qui manque / Ce qui est fait ..."
                           style="background-color: #ffffff; color: #000000;" />
                  </div>
  
                  <div class="p-field p-col-12 p-md-6" style="border-top: 2px solid #000000; padding-top: 1rem;">
                    <label style="color: #ffffff;">Suggestion:</label>
                    <input type="text"
                           pInputText
                           [(ngModel)]="doc.suggestion"
                           [readonly]="doc.type === 'TEXTE' && doc.suggestion"
                           placeholder="Suggestions d’amélioration"
                           style="background-color: #ffffff; color: #000000;" />
                  </div>
  
                  <div class="p-field p-col-12 p-md-3 p-d-flex p-jc-end p-ai-end">
                    <button
                      pButton
                      type="button"
                      label="✅ Evaluer Étudiant"
                      class="p-button-success"
                      (click)="goToSeancesList()">
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
  
        </div>
      </ng-template>
    </p-card>
  </div>
