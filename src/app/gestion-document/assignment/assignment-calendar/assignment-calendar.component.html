<full-calendar [options]="calendarOptions"></full-calendar>

<p-dialog
  header="📘 Détails du devoir"
  [(visible)]="showDialog"
  [modal]="true"
  [style]="{ width: '600px' }"
  [closable]="true"
  [contentStyle]="{ 'font-size': '1.1rem', 'line-height': '1.8' }"
>
  <ng-container *ngIf="selectedAssignment">
    <div class="p-mb-3">
      <i class="pi pi-book text-primary mr-2"></i>
      <strong>Titre :</strong> {{ selectedAssignment.titre }}
    </div>

    <div class="p-mb-3">
      <i class="pi pi-align-left text-secondary mr-2"></i>
      <strong>Description :</strong><br />
      <div style="margin-top: 5px; margin-left: 20px;">
        {{ selectedAssignment.description }}
      </div>
    </div>

    <div class="p-mb-3">
      <i class="pi pi-calendar-times text-warning mr-2"></i>
      <strong>Deadline :</strong>
      {{ selectedAssignment.dateLimite | date: 'fullDate' }}
    </div>

    <div class="p-mt-4 p-d-flex p-jc-center">
      <button
        *ngIf="!isExpired"
        type="button"
        pButton
        label="📤 Soumettre mon travail"
        class="p-button-success"
        (click)="submitAssignment()"
      ></button>

      <div
        *ngIf="isExpired"
        class="p-text-center text-red-600 text-lg font-semibold"
      >
        😢 La date limite est dépassée.<br />
        Vous ne pouvez plus soumettre ce devoir.
      </div>
    </div>
  </ng-container>
</p-dialog>
