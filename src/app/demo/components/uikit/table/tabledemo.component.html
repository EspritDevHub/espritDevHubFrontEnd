<!-- Table Projets -->

<div class="col-12 md:col-12">
    <div class="card widget-table">
      <div class="card-header line-height-4 mb-3">
        <h5>Liste des projets</h5>
      </div>
  
      <p-table [value]="projects" [paginator]="true" [rows]="5" [rowHover]="true">
        <ng-template pTemplate="header">
          <tr>
            <th>Code</th>
            <th>Titre</th>
            <th>Description</th>
            <th>État</th>
            <th>Étape</th>
            <th>Date Début</th>
            <th>Date Fin</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-project>
          <tr>
            <td>{{ project.code }}</td>
            <td>{{ project.titre }}</td>
            <td>{{ project.description }}</td>
            <td>{{ project.etat }}</td>
            <td>{{ project.etapeProjet }}</td>
            <td>{{ project.dateDebut | date: 'shortDate' }}</td>
            <td>{{ project.dateFinPrevu | date: 'shortDate' }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
