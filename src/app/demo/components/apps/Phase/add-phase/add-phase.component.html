<div class="card">
  <span class="block text-900 font-bold text-xl mb-4">
    {{ phase?.id ? 'Modifier une phase' : 'Ajouter une phase' }}
  </span>

    <form (ngSubmit)="onSubmit()" #phaseForm="ngForm" class="grid">
        <div class="col-12 lg:col-8">
            <div class="flex flex-column p-fluid">

                <!-- Nom -->
                <div class="mb-4">
                    <label for="name" class="block text-900 font-semibold mb-2">Nom</label>
                    <input
                        pInputText
                        type="text"
                        id="name"
                        name="name"
                        [(ngModel)]="phase.name"
                        #name="ngModel"
                        required
                        maxlength="100"
                    />
                    <small class="text-red-500" *ngIf="name.invalid && name.touched">
                        Le nom est requis.
                    </small>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="block text-900 font-semibold mb-2">Description</label>
                    <textarea
                        pInputTextarea
                        id="description"
                        name="description"
                        [(ngModel)]="phase.description"
                        rows="3"
                        maxlength="255"
                    ></textarea>
                </div>

                <!-- Date de début -->
                <div class="mb-4">
                    <label for="startDate" class="block text-900 font-semibold mb-2">Date de début</label>
                    <input
                        pInputText
                        type="date"
                        id="startDate"
                        name="startDate"
                        [(ngModel)]="phase.startDate"
                        #startDate="ngModel"
                        required
                    />
                    <small class="text-red-500" *ngIf="startDate.invalid && startDate.touched">
                        La date de début est requise.
                    </small>
                </div>

                <!-- Date de fin -->
                <div class="mb-4">
                    <label for="endDate" class="block text-900 font-semibold mb-2">Date de fin</label>
                    <input
                        pInputText
                        type="date"
                        id="endDate"
                        name="endDate"
                        [(ngModel)]="phase.endDate"
                        #endDate="ngModel"
                        required
                    />
                    <small class="text-red-500" *ngIf="endDate.invalid && endDate.touched">
                        La date de fin est requise.
                    </small>
                </div>

                <!-- Statut actif -->
                <div class="mb-4">
                    <label for="isActive" class="block text-900 font-semibold mb-2">Phase active ?</label>
                    <select
                        id="isActive"
                        name="isActive"
                        [(ngModel)]="phase.isActive"
                        required
                        class="p-inputtext p-component"
                    >
                        <option [ngValue]="true">Oui</option>
                        <option [ngValue]="false">Non</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Boutons -->
        <div class="col-12 lg:col-4">
            <div class="flex justify-content-between gap-3">
                <button
                    pButton
                    type="button"
                    class="p-button-secondary flex-1"
                    icon="pi pi-refresh"
                    label="Réinitialiser"
                    (click)="resetForm()"
                ></button>

                <button
                    pButton
                    type="submit"
                    class="p-button-primary flex-1"
                    icon="pi pi-save"
                    label="{{ phase?.id ? 'Mettre à jour' : 'Ajouter' }}"
                    [disabled]="phaseForm.invalid"
                ></button>
            </div>
        </div>
    </form>
</div>
