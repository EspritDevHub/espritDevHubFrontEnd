<div class="col-12 md:col-12">
    <div class="card widget-table">
        <div class="card-header line-height-4 mb-3">
            <h5>Liste des phases</h5>
        </div>

        <button pButton type="button" icon="pi pi-plus" class="p-button-success p-button-sm mb-3"
                [routerLink]="['/apps/phase/add']"> Ajouter Phase</button>

        <p-table [value]="phases" [paginator]="true" [rows]="5" [rowHover]="true">
            <ng-template pTemplate="header">
                <tr>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Début</th>
                    <th>Fin</th>
                    <th>Actif</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-phase>
                <tr>
                    <td>{{ phase.name }}</td>
                    <td>{{ phase.description }}</td>
                    <td>{{ phase.startDate | date: 'shortDate' }}</td>
                    <td>{{ phase.endDate | date: 'shortDate' }}</td>
                    <td>
            <span class="badge"
                  [ngClass]="{
                    'bg-green-500': phase.isActive,
                    'bg-red-500': !phase.isActive
                  }">
              {{ phase.isActive ? 'Oui' : 'Non' }}
            </span>
                    </td>
                    <td>
                        <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm me-2"
                                (click)="deletePhase(phase.id)"></button>

                        <button pButton type="button" icon="pi pi-pencil" class="p-button-warning p-button-sm me-2"
                                [routerLink]="['/apps/phase/edit', phase.id]"></button>

                        <button pButton type="button" icon="pi pi-info-circle" class="p-button-info p-button-sm"
                                [routerLink]="['/apps/phase/details', phase.id]"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
