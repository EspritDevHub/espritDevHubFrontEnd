<div class="col-12 md:col-12">
    <div class="card widget-table">
        <div class="card-header line-height-4 mb-3">
            <h5>Liste des sprints</h5>
        </div>

        <button pButton type="button" icon="pi pi-plus" class="p-button-success p-button-sm mb-3"
                [routerLink]="['/apps/sprint/add']"> Ajouter Sprint</button>

        <p-table [value]="sprints" [paginator]="true" [rows]="5" [rowHover]="true">
            <ng-template pTemplate="header">
                <tr>
                    <th>Titre</th>
                    <th>Phase</th>
                    <th>Début</th>
                    <th>Fin</th>
                    <th>Status</th>
                    <th>Actif</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-sprint>
                <tr>
                    <td>{{ sprint.title }}</td>
                    <td>{{ sprint.phaseName }}</td> <!-- Affichage de l'ID, ou tu peux charger le nom de la phase -->
                    <td>{{ sprint.startDate | date: 'short' }}</td>
                    <td>{{ sprint.endDate | date: 'short' }}</td>
                    <td>{{ sprint.status }}</td>
                    <td>
                        <span
                            class="badge"
                            [ngClass]="{
                                'bg-green-500': sprint.isActive,
                                'bg-red-500': !sprint.isActive
                            }"
                        >
                            {{ sprint.isActive ? 'Oui' : 'Non' }}
                        </span>
                    </td>
                    <td>
                        <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm me-2"
                                (click)="deleteSprint(sprint.id)"></button>

                        <button pButton type="button" icon="pi pi-pencil" class="p-button-warning p-button-sm me-2"
                                [routerLink]="['/apps/sprint/edit', sprint.id]"></button>

                        <button pButton type="button" icon="pi pi-info-circle" class="p-button-info p-button-sm"
                                [routerLink]="['/apps/sprint/details', sprint.id]"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
