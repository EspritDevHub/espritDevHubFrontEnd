<div class="col-12 md:col-12">
    <div class="card widget-table">
        <div class="card-header line-height-4 mb-3">
            <h5>Liste des événements</h5>
        </div>

        <button pButton type="button" icon="pi pi-plus" class="p-button-success p-button-sm mb-3"
                [routerLink]="['/apps/event/add']"> Ajouter Événement</button>

        <p-table [value]="events" [paginator]="true" [rows]="5" [rowHover]="true">
            <ng-template pTemplate="header">
                <tr>
                    <th>Titre</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th>Organisateur</th>
                    <th>Lieu</th>
                    <th>Date Début</th>
                    <th>Date Fin</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-event>
                <tr>
                    <td>{{ event.title }}</td>
                    <td>{{ event.description }}</td>
                    <td>{{ event.eventType }}</td>
                    <td>{{ event.organizer }}</td>
                    <td>{{ event.location }}</td>
                    <td>{{ event.startDate | date: 'short' }}</td>
                    <td>{{ event.endDate | date: 'short' }}</td>

                    <td>
                        <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm me-2"
                                (click)="deleteEvent(event.id)"></button>

                        <button pButton type="button" icon="pi pi-pencil" class="p-button-warning p-button-sm me-2"
                                [routerLink]="['/apps/event/edit', event.id]"></button>

                        <button pButton type="button" icon="pi pi-info-circle" class="p-button-info p-button-sm"
                                [routerLink]="['/apps/event/details', event.id]"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
