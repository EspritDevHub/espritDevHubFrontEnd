<div class="card">
    <span class="block text-900 font-bold text-xl mb-4">Créer un Événement</span>
    <form (ngSubmit)="updateEvent()" #eventForm="ngForm" class="grid">
        <div class="col-12 lg:col-8">
            <div class="flex flex-column p-fluid">

                <!-- Titre -->
                <div class="mb-4">
                    <label for="title" class="block text-900 font-semibold mb-2">Titre</label>
                    <input pInputText type="text" id="title" name="title" [(ngModel)]="event.title" #title="ngModel" required maxlength="100" />
                    <small class="text-red-500" *ngIf="title.invalid && title.touched">Le titre est requis et ne doit pas dépasser 100 caractères.</small>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="block text-900 font-semibold mb-2">Description</label>
                    <textarea pInputTextarea id="description" name="description" [(ngModel)]="event.description" rows="4"></textarea>
                </div>

                <!-- Date de début -->
                <div class="mb-4">
                    <label for="startDate" class="block text-900 font-semibold mb-2">Date de début</label>
                    <input pInputText type="datetime-local" id="startDate" name="startDate" [(ngModel)]="event.startDate" #startDate="ngModel" required />
                    <small class="text-red-500" *ngIf="startDate.invalid && startDate.touched">La date de début est requise.</small>
                </div>

                <!-- Date de fin -->
                <div class="mb-4">
                    <label for="endDate" class="block text-900 font-semibold mb-2">Date de fin</label>
                    <input pInputText type="datetime-local" id="endDate" name="endDate" [(ngModel)]="event.endDate" />
                </div>

                <!-- Type d'événement -->
                <div class="mb-4">
                    <label for="eventType" class="block text-900 font-semibold mb-2">Type d'événement</label>
                    <select
                        id="eventType"
                        name="eventType"
                        [(ngModel)]="event.eventType"
                        class="p-inputtext p-component text-white-700"
                        required
                    >
                        <option value="" disabled selected>-- Choisir un type --</option>
                        <option *ngFor="let type of eventTypes" [value]="type">{{ type }}</option>
                    </select>
                </div>


                <!-- Lieu -->
                <div class="mb-4">
                    <label for="location" class="block text-900 font-semibold mb-2">Lieu</label>
                    <input pInputText type="text" id="location" name="location" [(ngModel)]="event.location" />
                </div>

                <!-- Organisateur -->
                <div class="mb-4">
                    <label for="organizer" class="block text-900 font-semibold mb-2">Organisateur</label>
                    <input pInputText type="text" id="organizer" name="organizer" [(ngModel)]="event.organizer" />
                </div>


            </div>
        </div>

        <!-- Boutons -->
        <div class="col-12 lg:col-4">
            <div class="flex justify-content-between gap-3">
                <button
                    pButton
                    pRipple
                    type="button"
                    class="p-button-danger flex-1 p-button-outlined"
                    label="Annuler"
                    icon="pi pi-times"
                    (click)="resetForm(eventForm)">
                </button>
                <button
                    pButton
                    pRipple
                    type="submit"
                    class="p-button-primary flex-1"
                    label="Créer"
                    icon="pi pi-check"
                    [disabled]="eventForm.invalid">
                </button>
            </div>
        </div>
    </form>
</div>
