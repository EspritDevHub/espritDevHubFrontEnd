<div class="card">
    <span class="block text-900 font-bold text-xl mb-4">Ajouter un Projet</span>
    <form (ngSubmit)="addProjet()" #projectForm="ngForm" class="grid">
        <!-- Left Column: Main Inputs -->
        <div class="col-12 lg:col-8">
            <div class="flex flex-column p-fluid">
                <!-- Code -->
                <div class="mb-4">
                    <label for="code" class="block text-900 font-semibold mb-2">Code</label>
                    <input
                        type="text"
                        pInputText
                        id="code"
                        name="code"
                        [(ngModel)]="projet.code"
                        #code="ngModel"
                        required
                    />
                    <small class="text-red-500" *ngIf="code.invalid && code.touched">Le code est requis.</small>
                </div>

                <!-- Titre -->
                <div class="mb-4">
                    <label for="titre" class="block text-900 font-semibold mb-2">Titre</label>
                    <input
                        type="text"
                        pInputText
                        id="titre"
                        name="titre"
                        [(ngModel)]="projet.titre"
                        #titre="ngModel"
                        required
                    />
                    <small class="text-red-500" *ngIf="titre.invalid && titre.touched">Le titre est requis.</small>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="block text-900 font-semibold mb-2">Description</label>
                    <textarea
                        pInputTextarea
                        id="description"
                        name="description"
                        [(ngModel)]="projet.description"
                        #description="ngModel"
                        rows="5"
                        required
                        [autoResize]="true"
                    ></textarea>
                    <small class="text-red-500" *ngIf="description.invalid && description.touched">La description est requise.</small>
                </div>
            </div>
        </div>

        <!-- Right Column: Dates & Buttons -->
        <div class="col-12 lg:col-4">
            <div class="border-1 surface-border border-round p-fluid mb-4">
                <span class="text-900 font-bold block border-bottom-1 surface-border p-3">Détails du Projet</span>
                <div class="p-3">
                    <!-- Date début -->
                    <div class="mb-4">
                        <label for="dateDebut" class="block text-900 font-semibold mb-2">Date Début</label>
                        <input
                            type="date"
                            pInputText
                            id="dateDebut"
                            name="dateDebut"
                            [(ngModel)]="projet.dateDebut"
                        />
                    </div>

                    <!-- Date fin prévue -->
                    <div class="mb-4">
                        <label for="dateFinPrevu" class="block text-900 font-semibold mb-2">Date Fin Prévue</label>
                        <input
                            type="date"
                            pInputText
                            id="dateFinPrevu"
                            name="dateFinPrevu"
                            [(ngModel)]="projet.dateFinPrevu"
                        />
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-content-between gap-3">
                <button
                    pButton
                    pRipple
                    type="button"
                    class="p-button-danger flex-1 p-button-outlined"
                    label="Annuler"
                    icon="pi pi-fw pi-times"
                    (click)="resetForm(projectForm)"
                ></button>
                <button
                    pButton
                    pRipple
                    type="submit"
                    class="p-button-primary flex-1"
                    label="Ajouter"
                    icon="pi pi-fw pi-check"
                    [disabled]="projectForm.invalid"
                ></button>
            </div>
        </div>
    </form>
</div>
