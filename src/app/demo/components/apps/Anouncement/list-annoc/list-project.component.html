<div class="col-12 md:col-12">
    <div class="card widget-table">
        <div class="card-header line-height-4 mb-3">
            <h5>Liste des annonces</h5>
        </div>

        <button pButton type="button" icon="pi pi-plus" class="p-button-success p-button-sm mb-3"
                [routerLink]="['/apps/annoc/add']"> Ajouter Annonce</button>

        <p-table [value]="annocs" [paginator]="true" [rows]="5" [rowHover]="true">
            <ng-template pTemplate="header">
                <tr>
                    <th>Titre</th>
                    <th>Contenu</th>
                    <th>Créée le</th>
                    <th>Modifiée le</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-annoc>
                <tr>
                    <td>{{ annoc.title }}</td>
                    <td>{{ annoc.content }}</td>
                    <td>{{ annoc.createdAt | date: 'short' }}</td>
                    <td>{{ annoc.updatedAt | date: 'short' }}</td>
                    <td>
                        <span
                            class="badge"
                            [ngClass]="{
                                'bg-green-500': annoc.isActive === 1,
                                'bg-red-500': annoc.isActive === 0
                            }"
                        >
                            {{ annoc.isActive ? 'Oui' : 'Non' }}
                        </span>
                    </td>
                    <td>
                        <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm me-2"
                                (click)="deleteAnnoc(annoc.id)"></button>

                        <button pButton type="button" icon="pi pi-pencil" class="p-button-warning p-button-sm me-2"
                                [routerLink]="['/apps/annoc/edit', annoc.id]"></button>

                        <button pButton type="button" icon="pi pi-info-circle" class="p-button-info p-button-sm"
                                [routerLink]="['/apps/annoc/details', annoc.id]"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
