<div class="card">
    <span class="block text-900 font-bold text-xl mb-4">Créer une Annonce</span>

    <form (ngSubmit)="addAnnoc()" #annocForm="ngForm" class="grid">
        <div class="col-12 lg:col-8">
            <div class="flex flex-column p-fluid">

                <!-- Titre -->
                <div class="mb-4">
                    <label for="title" class="block text-900 font-semibold mb-2">Titre</label>
                    <input
                        pInputText
                        type="text"
                        id="title"
                        name="title"
                        [(ngModel)]="annoc.title"
                        #title="ngModel"
                        required
                        maxlength="100"
                    />
                    <small class="text-red-500" *ngIf="title.invalid && title.touched">
                        Le titre est requis et ne doit pas dépasser 100 caractères.
                    </small>
                </div>

                <!-- Contenu -->
                <div class="mb-4">
                    <label for="content" class="block text-900 font-semibold mb-2">Contenu</label>
                    <textarea
                        pInputTextarea
                        id="content"
                        name="content"
                        rows="5"
                        [(ngModel)]="annoc.content"
                        #content="ngModel"
                        required
                    ></textarea>
                    <small class="text-red-500" *ngIf="content.invalid && content.touched">
                        Le contenu est requis.
                    </small>
                </div>

                <!-- Active -->
                <div class="mb-4">
                    <label for="isActive" class="block text-900 font-semibold mb-2">Annonce active ?</label>
                    <select
                        id="isActive"
                        name="isActive"
                        [(ngModel)]="annoc.isActive"
                        required
                        class="p-inputtext p-component"
                    >
                        <option [ngValue]="1">Oui</option>
                        <option [ngValue]="0">Non</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Boutons -->
        <div class="col-12 lg:col-4">
            <div class="flex justify-content-between gap-3">
                <button
                    pButton
                    pRipple
                    type="button"
                    class="p-button-danger flex-1 p-button-outlined"
                    label="Annuler"
                    icon="pi pi-times"
                    (click)="resetForm(annocForm)">
                </button>

                <button
                    pButton
                    pRipple
                    type="submit"
                    class="p-button-primary flex-1"
                    label="Créer"
                    icon="pi pi-check"
                    [disabled]="annocForm.invalid">
                </button>
            </div>
        </div>
    </form>
</div>
